<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Turtle Aquarium Engine</title>
  
  <!-- External Resources -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Passcode Security Overlay -->
  <div id="passwordLockOverlay">
    <div class="lock-card">
      <h2><i data-lucide="waves"></i> Classroom Aquarium</h2>
      <p>Enter passcode to unlock admin controls:</p>
      <input type="password" id="passcodeInput" placeholder="Enter passcode..." autofocus />
      <button id="unlockBtn" class="btn primary" style="width: 100%;">Unlock Dashboard</button>
      <p id="lockErrorMessage">Incorrect passcode. Please try again!</p>
    </div>
  </div>

  <!-- Main Web App Layout -->
  <div class="aquarium-app">
    
    <!-- Mobile Header -->
    <header class="mobile-navbar">
      <h2>🐢 Turtle Aquarium</h2>
      <button id="toggleSidebarBtn" class="btn primary">☰ Controls</button>
    </header>

    <!-- Sidebar Control Dashboard -->
    <aside class="sidebar" id="appSidebar">
      <div class="brand">
        <h2>🐢 Turtle Aquarium</h2>
        <button id="relockBtn" class="btn danger" title="Lock Controls"><i data-lucide="lock"></i> Lock</button>
      </div>

      <!-- 1. Classroom Creation -->
      <div class="control-box">
        <h3>1. Create Classroom</h3>
        <div class="input-group">
          <input type="text" id="newClassInput" placeholder="e.g. Science Section A" />
          <button id="createClassBtn" class="btn primary">+ Create</button>
        </div>
      </div>

      <!-- 2. Active Classroom Dropdown -->
      <div class="control-box">
        <h3>2. Active Classroom</h3>
        <select id="classDropdown">
          <option value="">Loading classrooms...</option>
        </select>
      </div>

      <!-- Live Leaderboard -->
      <div class="control-box leaderboard-box">
        <h3>🏆 Class Leaderboard</h3>
        <div id="leaderboardList" class="leaderboard-list">
          <div class="empty-msg">No students ranked yet</div>
        </div>
      </div>

      <!-- 3. Bulk Add Students -->
      <div class="control-box">
        <h3>3. Add Students in Bulk</h3>
        <textarea id="bulkStudentInput" placeholder="Enter student names (one per line)..."></textarea>
        <button id="addStudentsBtn" class="btn success">+ Add Turtles to Tank</button>
      </div>

      <!-- 4. Feeding Directory -->
      <div class="control-box student-feed-panel">
        <h3>4. Feed Turtles</h3>
        <div id="studentList" class="student-list"></div>
      </div>
    </aside>

    <!-- Aquarium Viewport -->
    <main class="aquarium-container">
      <div class="aquarium-overlay">
        <h1 id="activeClassTitle">No Classroom Selected</h1>
        <button id="syncSheetBtn" class="btn sync"><i data-lucide="refresh-cw"></i> Sync Sheets</button>
      </div>
      <canvas id="aquariumCanvas"></canvas>
    </main>
  </div>

  <!-- Main Script File -->
  <script src="script.js"></script>
</body>
</html>
