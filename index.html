<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Turtle Aquarium</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fullscreen Security Lock Overlay -->
  <div id="passwordLockOverlay">
    <div class="lock-card">
      <h2>🐢 Classroom Aquarium</h2>
      <p>Enter passcode to access admin controls:</p>
      <input type="password" id="passcodeInput" placeholder="Enter passcode..." />
      <button id="unlockBtn" class="btn primary">Unlock Aquarium</button>
      <p id="lockErrorMessage">Incorrect passcode. Try again!</p>
    </div>
  </div>

  <!-- Main Web Application -->
  <div class="aquarium-app">
    
    <!-- Mobile Navigation Header -->
    <header class="mobile-navbar">
      <h2>🐢 Aquarium</h2>
      <button id="toggleSidebarBtn" class="btn primary">☰ Controls</button>
    </header>

    <!-- Sidebar Controls -->
    <aside class="sidebar" id="appSidebar">
      <div class="brand">
        <h2>🐢 Turtle Aquarium</h2>
        <button id="relockBtn" class="btn danger" title="Lock Controls">🔒 Lock</button>
      </div>

      <!-- Step 1: Create Classroom -->
      <div class="control-box">
        <h3>1. Create Classroom</h3>
        <div class="input-group">
          <input type="text" id="newClassInput" placeholder="e.g. Grade 5 Alpha" />
          <button id="createClassBtn" class="btn primary">+ Create</button>
        </div>
      </div>

      <!-- Step 2: Select Active Classroom -->
      <div class="control-box">
        <h3>2. Active Classroom</h3>
        <select id="classDropdown">
          <option value="">Loading classrooms...</option>
        </select>
      </div>

      <!-- Leaderboard / Ranking Section -->
      <div class="control-box leaderboard-box">
        <h3>🏆 Class Leaderboard</h3>
        <div id="leaderboardList" class="leaderboard-list">
          <div class="empty-msg">No students ranked yet</div>
        </div>
      </div>

      <!-- Step 3: Add Students in Bulk -->
      <div class="control-box">
        <h3>3. Add Students in Bulk</h3>
        <textarea id="bulkStudentInput" placeholder="Enter student names (one per line)..."></textarea>
        <button id="addStudentsBtn" class="btn success">+ Add Turtles to Tank</button>
      </div>

      <!-- Step 4: Feed Turtles -->
      <div class="control-box student-feed-panel">
        <h3>4. Feed Turtles</h3>
        <div id="studentList" class="student-list"></div>
      </div>
    </aside>

    <!-- Aquarium Viewport -->
    <main class="aquarium-container">
      <div class="aquarium-overlay">
        <h1 id="activeClassTitle">No Classroom Selected</h1>
        <button id="syncSheetBtn" class="btn sync">🔄 Sync</button>
      </div>
      <canvas id="aquariumCanvas"></canvas>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
