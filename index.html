<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Aquarium</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="aquarium-app">
    <!-- Sidebar Controls -->
    <aside class="sidebar">
      <div class="brand">
        <h2>🐢 Turtle Aquarium</h2>
      </div>

      <!-- Step 1: Create Classroom -->
      <div class="control-box">
        <h3>1. Create Classroom</h3>
        <div class="input-group">
          <input type="text" id="newClassInput" placeholder="Class Name (e.g. Grade 5 A)" />
          <button id="createClassBtn" class="btn primary">+ Create</button>
        </div>
      </div>

      <!-- Step 2: Classroom Selection -->
      <div class="control-box">
        <h3>2. Active Classroom</h3>
        <select id="classDropdown">
          <option value="">Select a classroom...</option>
        </select>
      </div>

      <!-- Step 3: Add Students -->
      <div class="control-box">
        <h3>3. Add Students</h3>
        <textarea id="bulkStudentInput" placeholder="Enter student names (one per line)..."></textarea>
        <button id="addStudentsBtn" class="btn success">+ Add Turtles to Tank</button>
      </div>

      <!-- Step 4: Quick Feed List -->
      <div class="control-box student-feed-panel">
        <h3>4. Feed Turtles</h3>
        <div id="studentList" class="student-list"></div>
      </div>
    </aside>

    <!-- Interactive Canvas Aquarium -->
    <main class="aquarium-container">
      <div class="aquarium-overlay">
        <h1 id="activeClassTitle">No Classroom Selected</h1>
        <button id="syncSheetBtn" class="btn sync">🔄 Sync Spreadsheet</button>
      </div>
      <canvas id="aquariumCanvas"></canvas>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
